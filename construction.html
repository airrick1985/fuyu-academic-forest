      #pwa-loading-overlay {

</head>

                    steps: [

                        '專設一戶電動車電表：向台電申請獨立電表，與家用、公設用電完全分開，無超載疑慮，用電更安全。',
                        '匯流排槽（Busway）於高科技廠房、醫院、商辦已使用超過 60 年，耐燃、檢修容易，安全穩定可靠。',

                        'EMS 電能管理系統：預約尖離峰充電享便宜費率、充電狀態即時監控、自動計費免人工抄表。',

            // ===== DOM 參照 =====
            const navList = document.getElementById('conNavList');
            const imgFront = document.getElementById('conImgFront');
            const imgBack = document.getElementById('conImgBack');
            const infoPanel = document.getElementById('conInfoPanel');
            const infoContent = document.getElementById('conInfoContent');
            const categoryBadge = document.getElementById('conCategoryBadge');
            const infoTitle = document.getElementById('conInfoTitle');
            const infoSubtitle = document.getElementById('conInfoSubtitle');
            const infoDesc = document.getElementById('conInfoDesc');
            const stepCurrent = document.getElementById('conStepCurrent');
            const stepTotal = document.getElementById('conStepTotal');
            const lightbox = document.getElementById('conLightbox');
            const lightboxImg = document.getElementById('conLightboxImg');
            const lightboxClose = document.getElementById('conLightboxClose');
            const conDisplay = document.getElementById('conDisplay');
            const conImageArea = document.getElementById('conImageArea');
            const zoomHint = document.getElementById('conZoomHint');

            let currentIndex = 0;
            let isTransitioning = false;
            let isFrontActive = true; // 追蹤哪一層在前
            let kenBurnsCounter = 0;

            // ===== 初始化 =====
            function init() {
                buildNavList();
                loadMethodImage(methods[0], imgFront, true);
                updateInfoPanel(methods[0], false);
                updateStepIndicator(0);
                stepTotal.textContent = `/ ${String(methods.length).padStart(2, '0')}`;

                // 預載相鄰圖片
                preloadImage(methods[1].image);

                // 入場動畫延遲隱藏提示
                setTimeout(() => {
                    zoomHint.classList.add('fade-out');
                }, 200);
            }

            // ===== 建立側邊導航列 =====
            function buildNavList() {
                let lastCategory = '';
                const categoryNames = {
                    geology: { zh: '地質安心', en: 'GEOLOGY' },
                    waterproof: { zh: '防水工法', en: 'WATERPROOF' },
                    structure: { zh: '結構工法', en: 'STRUCTURE' },
                    smart: { zh: '智慧設備', en: 'SMART SYSTEM' }
                };

                methods.forEach((m, i) => {
                    // 分類分隔線
                    if (m.category !== lastCategory) {
                        const cat = categoryNames[m.category];
                        const divider = document.createElement('li');
                        divider.className = 'con-nav-divider';
                        divider.innerHTML = `
                            <span class="con-nav-divider-line"></span>
                            <span class="con-nav-divider-text">
                                <span class="con-nav-divider-zh">${cat.zh}</span>
                                <span class="con-nav-divider-en">${cat.en}</span>
                            </span>
                            <span class="con-nav-divider-line"></span>
                        `;
                        navList.appendChild(divider);
                        lastCategory = m.category;
                    }

                    const li = document.createElement('li');
                    li.className = 'con-nav-item entrance' + (i === 0 ? ' active' : '');
                    li.style.animationDelay = `${0.3 + i * 0.06}s`;
                    li.dataset.index = i;
                    li.innerHTML = `
                        <span class="con-nav-dot" data-cat="${m.category}"></span>
                        <span class="con-nav-label">${m.title}</span>
                    `;
                    li.addEventListener('click', () => goToMethod(i));
                    navList.appendChild(li);
                });
            }


            // ===== 核心：切換工法 =====
            function goToMethod(index) {
                if (isTransitioning || index === currentIndex) return;
                if (index < 0 || index >= methods.length) return;

                isTransitioning = true;
                const method = methods[index];
                currentIndex = index;

                // 取得目前顯示的圖層
                const activeLayer = isFrontActive ? imgFront : imgBack;
                const hiddenLayer = isFrontActive ? imgBack : imgFront;

                // 1. 確保隱藏層完全不可見並清空
                hiddenLayer.style.transition = 'none';
                hiddenLayer.style.opacity = '0';
                hiddenLayer.innerHTML = '';

                // 2. 舊圖淡出
                activeLayer.style.transition = 'opacity 0.45s ease-out';
                activeLayer.style.opacity = '0';

                // 3. 面板內容退場動畫
                infoContent.classList.add('exit');
                infoContent.classList.remove('enter');

                // 4. 更新導航列 / dots / 步驟
                updateNavActive(index);
                updateStepIndicator(index);

                // 5. 舊圖淡出完成後，載入新圖到隱藏層並淡入
                setTimeout(() => {
                    // 清空舊的活躍層
                    activeLayer.style.transition = 'none';
                    activeLayer.style.opacity = '0';
                    activeLayer.style.zIndex = '2';
                    activeLayer.innerHTML = '';

                    // 在隱藏層載入新圖片
                    loadMethodImage(method, hiddenLayer, false);
                    hiddenLayer.style.zIndex = '3';

                    // 強制重繪
                    void hiddenLayer.offsetWidth;

                    // 新圖淡入
                    hiddenLayer.style.transition = 'opacity 0.5s ease-in';
                    hiddenLayer.style.opacity = '1';

                    // 切換活躍層指標
                    isFrontActive = !isFrontActive;
                }, 480);

                // 6. 更新面板內容（配合新圖淡入時序）
                setTimeout(() => {
                    updateInfoPanel(method, true);
                    infoContent.classList.remove('exit');
                    infoContent.classList.add('enter');

                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            infoContent.classList.remove('enter');
                        });
                    });
                }, 550);

                // 7. 轉場完成
                setTimeout(() => {
                    isTransitioning = false;

                    // 預載相鄰圖片
                    if (index > 0) preloadImage(methods[index - 1].image);
                    if (index < methods.length - 1) preloadImage(methods[index + 1].image);
                }, 1050);
            }

            // ===== EMS 專屬版面（電動車充電匯流排）：三分頁 =====
            function buildEmsLayout() {
                const steps = [
                    { icon: 'assets/images/construction method/EMS步驟1-電表.webp', num: 'STEP 1', name: '申請專設一戶電表', desc: '向台電申請獨立電動車充電電表', time: '約 1~3 個月' },
                    { icon: 'assets/images/construction method/EMS步驟2-匯流排槽.webp', num: 'STEP 2', name: '匯流排槽佈建', desc: '全區規劃、全區佈建匯流排槽', time: '約 1~2 個月' },
                    { icon: 'assets/images/construction method/EMS步驟3-充電樁.webp', num: 'STEP 3', name: '安裝充電樁', desc: '依住戶需求隨時申請加裝', time: '約 2~3 週' }
                ];
                const rows = [
                    ['耐燃性', '〇 耐燃', '✕ 易燃'],
                    ['所需空間', '小', '大'],
                    ['擴充性', '可隨時調整', '需重新佈線'],
                    ['通訊 / 網路', '內建', '需另外加裝'],
                    ['檢修維護', '容易', '困難'],
                    ['使用年限', '長', '短'],
                    ['住戶拉線費用', '相同容量價格相同', '依距離長度而不同']
                ];
                const emsFeatures = [
                    { icon: '⏱️', name: '預約充電', desc: '自主選擇尖離峰時段充電，享便宜離峰費率；使用者付費，尖離峰分開計費。' },
                    { icon: '🛡️', name: '用電安全', desc: '台電專設一戶獨立電表，與家庭用電完全分開，無超載疑慮，在自己車位安心充電。' },
                    { icon: '⚡', name: '充電速度', desc: '充電樁容量可自由選擇，使用夜間離峰時間充電，起床時就已經充飽電。' },
                    { icon: '🔌', name: '彈性擴充', desc: '於住戶安裝時再進行擴充付費，讓未來每一個車位都能充得到電。' }
                ];

                const stepsHtml = steps.map((s, i) => `
                    ${i > 0 ? '<div class="con-ems-arrow">➜</div>' : ''}
                    <div class="con-ems-step-card">
                        <div class="con-ems-step-icon"><img src="${s.icon}" alt="${s.name}" draggable="false"></div>
                        <div class="con-ems-step-body">
                            <div class="con-ems-step-num">${s.num}</div>
                            <div class="con-ems-step-name">${s.name}</div>
                            <div class="con-ems-step-desc">${s.desc}</div>
                            <div class="con-ems-step-time">${s.time}</div>
                        </div>
                    </div>
                `).join('');

                const rowsHtml = rows.map(r => `
                    <tr>
                        <td class="con-ems-td-label">${r[0]}</td>
                        <td class="con-ems-td-busway">${r[1]}</td>
                        <td class="con-ems-td-cable">${r[2]}</td>
                    </tr>
                `).join('');

                const featuresHtml = emsFeatures.map(f => `
                    <div class="con-ems-feature-card">
                        <div class="con-ems-feature-icon">${f.icon}</div>
                        <div class="con-ems-feature-body">
                            <div class="con-ems-feature-name">${f.name}</div>
                            <div class="con-ems-feature-desc">${f.desc}</div>
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="con-ems-layout">
                        <div class="con-ems-tabs">
                            <button class="con-ems-tab active" data-panel="steps">社區充電・建置三步驟</button>
                            <button class="con-ems-tab" data-panel="compare">匯流排槽 <span class="con-ems-tab-vs">VS</span> 電纜線槽</button>
                            <button class="con-ems-tab" data-panel="ems">電能管理系統 EMS</button>
                        </div>
                        <div class="con-ems-panels">
                            <div class="con-ems-panel active" data-panel="steps">
                                <div class="con-ems-section-title">社區充電・建置三步驟</div>
                                <div class="con-ems-steps">${stepsHtml}</div>
                            </div>
                            <div class="con-ems-panel" data-panel="compare">
                                <div class="con-ems-section-title">匯流排槽 Busway <span class="con-ems-vs">VS</span> 傳統電纜線槽</div>
                                <table class="con-ems-table">
                                    <thead>
                                        <tr>
                                            <th></th>
                                            <th class="con-ems-th-busway">匯流排槽</th>
                                            <th class="con-ems-th-cable">電纜線槽</th>
                                        </tr>
                                    </thead>
                                    <tbody>${rowsHtml}</tbody>
                                </table>
                            </div>
                            <div class="con-ems-panel" data-panel="ems">
                                <div class="con-ems-section-title">電能管理系統（EMS）</div>
                                <p class="con-ems-intro">EMS 即時管理充電樁狀態與電流，進行安全管控；並協助社區自動計費、收費管理，免人工抄表，更加便利可靠。</p>
                                <div class="con-ems-features">${featuresHtml}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // ===== 載入圖片到圖層 =====
            function loadMethodImage(method, layer, isEntrance) {
                // 專屬版面（非單張圖片）
                if (method.customType === 'ems') {
                    if (isEntrance) layer.classList.add('entrance');
                    layer.innerHTML = buildEmsLayout();
                    zoomHint.style.display = 'none';
                    return;
                }
                zoomHint.style.display = '';

                kenBurnsCounter++;
                const kbClass = kenBurnsCounter % 2 === 0 ? 'ken-burns-1' : 'ken-burns-2';

                const img = document.createElement('img');
                img.src = method.image;
                img.alt = method.title;
                img.draggable = false;
                img.className = kbClass;

                if (isEntrance) {
                    layer.classList.add('entrance');
                }

                layer.innerHTML = '';
                layer.appendChild(img);

                // 圖片點擊放大
                img.style.cursor = 'zoom-in';
                img.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openLightbox(method.image, method.title);
                });
            }

            // ===== 更新說明面板 =====
            function updateInfoPanel(method, animated) {
                categoryBadge.textContent = method.categoryLabel;
                categoryBadge.dataset.cat = method.category;
                infoTitle.textContent = method.title;
                infoSubtitle.textContent = method.subtitle;

                if (method.isStepList && method.steps) {
                    const stepsHtml = method.steps.map(s => `<li>${s}</li>`).join('');
                    infoDesc.innerHTML = `<ol class="con-step-list">${stepsHtml}</ol>`;
                } else {
                    infoDesc.innerHTML = `<p>${method.description}</p>`;
                }
            }

            // ===== 更新導航列 Active =====
            function updateNavActive(index) {
                const items = navList.querySelectorAll('.con-nav-item');
                items.forEach((item, i) => {
                    item.classList.toggle('active', parseInt(item.dataset.index) === index);
                });

                // 滾動到可視範圍
                const activeItem = navList.querySelector('.con-nav-item.active');
                if (activeItem) {
                    activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }


            // ===== 更新步驟指示器 =====
            function updateStepIndicator(index) {
                stepCurrent.style.opacity = '0';
                setTimeout(() => {
                    stepCurrent.textContent = String(index + 1).padStart(2, '0');
                    stepCurrent.style.opacity = '1';
                }, 250);
            }

            // ===== Lightbox =====
            function openLightbox(src, alt) {
                lightboxImg.src = src;
                lightboxImg.alt = alt;
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
                // 隱藏 topbar
                const topbar = document.getElementById('topbar-root');
                if (topbar) topbar.style.display = 'none';
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
                // 恢復 topbar
                const topbar = document.getElementById('topbar-root');
                if (topbar) topbar.style.display = '';
            }

            lightboxClose.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox || e.target === lightboxImg) {
                    closeLightbox();
                }
            });

            // ===== 上一個 / 下一個 =====
            function goPrev() {
                const newIndex = currentIndex > 0 ? currentIndex - 1 : methods.length - 1;
                goToMethod(newIndex);
            }

            function goNext() {
                const newIndex = currentIndex < methods.length - 1 ? currentIndex + 1 : 0;
                goToMethod(newIndex);
            }


            // ===== 鍵盤控制 =====
            document.addEventListener('keydown', (e) => {
                // Lightbox 開著時只處理 Escape
                if (lightbox.classList.contains('active')) {
                    if (e.key === 'Escape') closeLightbox();
                    return;
                }

                switch (e.key) {
                    case 'ArrowLeft':
                    case 'ArrowUp':
                        e.preventDefault();
                        goPrev();
                        break;
                    case 'ArrowRight':
                    case 'ArrowDown':
                        e.preventDefault();
                        goNext();
                        break;
                    case 'Home':
                        e.preventDefault();
                        goToMethod(0);
                        break;
                    case 'End':
                        e.preventDefault();
                        goToMethod(methods.length - 1);
                        break;
                    case 'Escape':
                        // 無操作（交給 topbar 或其他邏輯）
                        break;
                    default:
                        // 數字鍵快速跳轉 1~9, 0=10
                        if (e.key >= '1' && e.key <= '9') {
                            const idx = parseInt(e.key) - 1;
                            if (idx < methods.length) goToMethod(idx);
                        } else if (e.key === '0' && methods.length >= 10) {
                            goToMethod(9);
                        }
                        break;
                }
            });

            // ===== 滑鼠滾輪切換頁面：已停用（保留捲動內容的原生行為） =====

            // ===== EMS 版面分頁切換（事件委派，版面重建後仍有效） =====
            conImageArea.addEventListener('click', (e) => {
                const tab = e.target.closest('.con-ems-tab');
                if (!tab) return;
                const layout = tab.closest('.con-ems-layout');
                layout.querySelectorAll('.con-ems-tab').forEach(t => t.classList.toggle('active', t === tab));
                layout.querySelectorAll('.con-ems-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === tab.dataset.panel));
            });

            // ===== 觸控滑動控制 =====
            let touchStartX = 0;
            let touchStartY = 0;

            conImageArea.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].clientX;
                touchStartY = e.changedTouches[0].clientY;
            }, { passive: true });

            conImageArea.addEventListener('touchend', (e) => {
                const deltaX = e.changedTouches[0].clientX - touchStartX;
                const deltaY = e.changedTouches[0].clientY - touchStartY;

                // 只有水平滑動距離大於閾值才觸發
                if (Math.abs(deltaX) > 60 && Math.abs(deltaX) > Math.abs(deltaY)) {
                    if (deltaX < 0) {
                        goNext();
                    } else {
                        goPrev();
                    }
                }
            }, { passive: true });

            // ===== 圖片預載 =====
            const preloadedImages = new Set();
            function preloadImage(src) {
                if (!src || preloadedImages.has(src)) return;
                preloadedImages.add(src);
                const img = new Image();
                img.src = src;
            }

            // ===== 啟動 =====
            init();
        })();
    </script>
    <script src="js/spa-router.js?v=1.0.6"></script>
    <!-- Asset Update Manager -->
    <script src="js/asset-update-manager.js"></script>
    <script src="js/pwa-register.js?v=1.0.6" defer></script>
